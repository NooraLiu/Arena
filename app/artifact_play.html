<title>Arena 玩家席</title>
<style>
  :root{--bg:#0f1220;--card:#191d33;--card2:#12162a;--ink:#e8eaf2;--dim:#9aa0bd;--line:#2a2f4a;
        --hit:#ff6b6b;--win:#ffd166;--zone:#6ea8fe;--ok:#7ee787;--dm:#c3a6ff;
        --weapon:#EF9F27;--food:#1D9E75;--ammo:#378ADD;--armor:#888780;--violet:#7F77DD;
        color-scheme:dark}   /* one deliberate dark look, same as the local 玩家席 */
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  h1{font-size:17px;margin:0 8px 0 0}
  .pill{padding:3px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px}
  .pill.turn{background:#2b5a33;border-color:#3f8a4b;color:#dfffe4;font-weight:600}
  main{max-width:1120px;margin:0 auto;padding:14px 16px}
  .grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .panel h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.04em}
  .k{color:var(--dim);font-size:12px}
  .row{margin:3px 0}
  .scroll{max-height:240px;overflow:auto}
  .msg{padding:4px 0;border-bottom:1px solid #22273f;font-size:13px}.msg:last-child{border:none}.msg.dm{color:var(--dm)}
  .err{color:var(--hit);white-space:pre-wrap;margin:6px 0}
  .ok{color:var(--ok)}
  .big{font-size:15px;color:var(--win);font-weight:600}
  /* map */
  .map{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,minmax(84px,auto));gap:8px}
  .zone{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:8px;transition:border-color .15s,background .15s}
  .zone.closed{opacity:.3}.zone.here{box-shadow:inset 0 0 0 1px #3f8a4b}
  .zone.pick{cursor:pointer;border-color:#3a469a;border-style:dashed}.zone.pick:hover{background:#1c2140}
  .zone.chosen{border:2px solid var(--zone);background:#1c2447}
  .zone .zt{font-size:12px;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
  .zone .go{font-size:11px;color:var(--zone);font-weight:600}
  .zc{grid-column:2;grid-row:2}.zn{grid-column:2;grid-row:1}.ze{grid-column:3;grid-row:2}.zs{grid-column:2;grid-row:3}.zw{grid-column:1;grid-row:2}
  .tok{display:inline-flex;align-items:center;gap:4px;margin:2px;padding:3px 8px;border-radius:9px;border:1px solid var(--line);background:#0e1226;font-size:12.5px}
  .tok.me{border-color:var(--ok)}.tok.dead{opacity:.4;text-decoration:line-through}
  .tok.talk{cursor:pointer}.tok.talk:hover{border-color:var(--dm);color:var(--dm)}
  .hpmini{display:inline-block;width:28px;height:4px;border-radius:2px;background:#2a2f4a;overflow:hidden;vertical-align:middle}
  .hpmini i{display:block;height:100%}
  /* character card */
  .cc-top{display:flex;gap:14px;align-items:center}
  .avatar{width:64px;height:64px;border-radius:14px;background:#26215C;border:2px solid var(--violet);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#CECBF6;flex:none}
  .cc-name{font-size:19px;font-weight:700}
  .cc-desc{font-size:12px;color:var(--dim);margin:2px 0 7px;line-height:1.45}
  .hpbar{flex:1;height:11px;border-radius:6px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
  .hpbar i{display:block;height:100%;transition:width .3s}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
  .stat{background:var(--card2);border-radius:10px;padding:8px;text-align:center}
  .stat .v{font-size:21px;font-weight:700}
  .stat.hl{border:1px solid var(--weapon)}.stat.hl .v{color:var(--win)}
  .skill{border:1px solid #3C3489;background:#171533;border-radius:10px;padding:9px 12px;margin-bottom:14px}
  .skill .t{font-size:12px;color:#AFA9EC;margin-bottom:3px;font-weight:600}
  .slot{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--weapon);border-radius:10px;padding:8px 11px;margin:4px 0 14px}
  .slot.empty{border:1px dashed var(--line);color:var(--dim)}
  .slot .ic{font-size:22px}
  .hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
  .gc{aspect-ratio:3/4;border:1.5px solid var(--line);border-radius:10px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;user-select:none}
  .gc .ic{font-size:22px}.gc .nm{font-size:12px;text-align:center;padding:0 3px}.gc .val{font-size:11px;font-weight:700}
  .gc.weapon{border-color:var(--weapon)}.gc.weapon .val{color:var(--weapon)}
  .gc.food{border-color:var(--food)}.gc.food .val{color:#5DCAA5}
  .gc.ammo{border-color:var(--ammo)}.gc.ammo .val{color:#85B7EB}
  .gc.armor{border-color:var(--armor)}
  .gc.slotfree{border-style:dashed;color:var(--dim);font-size:11px}
  .gc.edible{cursor:pointer}.gc.edible:hover{background:#12291f}
  .gc.eating{background:#0f3326;border-color:#5DCAA5;border-width:2px}
  .gc .badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#1D9E75;color:#04342C;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
  .legend{display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--dim)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
  /* form */
  .sec{margin:12px 0}.sec>.lbl{font-size:12.5px;color:var(--dim);margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
  .chip:hover{border-color:#3a469a}
  .chip.on{background:#2b3566;border-color:var(--zone);color:#fff;font-weight:600}
  .chip.sm{padding:3px 9px;font-size:12px}
  .chip.dm.on{background:#3a2a5c;border-color:var(--dm)}
  .xbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--card2)}
  .xbox.on{border-color:var(--zone)}
  .xbox .sub{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .say{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  input.txt,textarea{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%}
  textarea{min-height:56px}
  .go-btn{font:inherit;font-weight:700;font-size:15px;color:#fff;background:#2f5bd3;border:none;border-radius:11px;padding:10px 22px;cursor:pointer}
  .go-btn:disabled{opacity:.5;cursor:default}
  .ghost-btn{font:inherit;font-size:12.5px;color:var(--dim);background:none;border:1px dashed var(--line);border-radius:9px;padding:4px 10px;cursor:pointer}
  details pre{white-space:pre-wrap;font:12.5px/1.55 -apple-system,"PingFang SC",sans-serif;color:#cdd3f0;max-height:420px;overflow:auto}
  a{color:var(--zone)}
  /* dice: a d-N die is an N-sided polygon (d2 is a coin); the face it lands on is the damage */
  .dice{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin:8px 0 2px}
  .die{display:flex;flex-direction:column;align-items:center;gap:3px}
  .die svg{width:64px;height:64px;overflow:visible}
  .die .shape{fill:var(--card2);stroke:var(--weapon);stroke-width:3;stroke-linejoin:round}
  .die .num{fill:var(--ink);font:700 24px -apple-system,"PingFang SC",sans-serif;text-anchor:middle;dominant-baseline:central}
  .die .dn{font-size:11px;color:var(--dim)}
  .die.best .shape{stroke:var(--win);stroke-width:4}
  .die.coin .shape{stroke:var(--win)}
  .die svg{filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
  .die.rolling svg{animation:tumble 1.1s cubic-bezier(.2,.7,.3,1)}
  .die.coin.rolling svg{animation:flip 1.1s cubic-bezier(.2,.7,.3,1)}
  .die.landed .num{animation:pop .45s ease-out}
  @keyframes tumble{0%{transform:translateY(-30px) rotate(0) scale(.8)}35%{transform:translateY(0) rotate(420deg) scale(1.1)}
    55%{transform:translateY(-12px) rotate(600deg)}75%{transform:translateY(0) rotate(700deg)}88%{transform:translateY(-3px) rotate(716deg)}100%{transform:translateY(0) rotate(720deg) scale(1)}}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
  .die .num{transform-box:fill-box;transform-origin:center}
  @keyframes flip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-26px)}100%{transform:rotateY(1800deg) translateY(0)}}
  @media (prefers-reduced-motion: reduce){.die.rolling svg,.die.coin.rolling svg{animation:none}}
  .roll-btn{font:inherit;font-weight:700;color:#fff;background:#8a5a12;border:1px solid var(--weapon);border-radius:10px;padding:8px 16px;cursor:pointer}
  .roll-btn:disabled{opacity:.5;cursor:default}
  .dmg{font-size:15px;font-weight:700;color:var(--win)}
  /* round bar: every round, with the random-event rounds marked */
  .roundbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .roundbar .lbl{font-size:12px;color:var(--dim);margin-right:4px}
  .rb{min-width:30px;height:30px;padding:0 4px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:2px;
    font-size:12px;font-variant-numeric:tabular-nums;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
  .rb.past{opacity:.55}
  .rb.now{border-color:var(--zone);color:#fff;background:#1c2447;font-weight:700;box-shadow:0 0 0 2px rgba(110,168,254,.25)}
  .rb.ev{border-color:#8a6a2a;color:var(--win)}
  .rb.ev.future{background:repeating-linear-gradient(135deg,#221c10 0 4px,#181410 4px 8px)}
  .rb .ic{font-size:13px}
  .roundbar .key{margin-left:auto;font-size:11.5px;color:var(--dim)}
  /* dice stage: a dark arcane circle, the die floats and spins over it */
  .tray{position:relative;height:260px;max-width:460px;border-radius:16px;margin:8px 0;overflow:hidden;
    background:radial-gradient(ellipse at 50% 55%,#2a1850 0%,#140c28 45%,#07060d 100%);box-shadow:inset 0 0 0 1px #3a2a60,inset 0 0 40px rgba(0,0,0,.6)}
  .tray canvas{display:block;position:relative;z-index:1}
  .drings,.drings::before{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none}
  .drings{width:220px;height:220px;margin:-110px 0 0 -110px;border:1px solid rgba(243,201,105,.35);
    background:repeating-conic-gradient(from 0deg,rgba(243,201,105,.55) 0 2deg,transparent 2deg 15deg);
    -webkit-mask:radial-gradient(circle,transparent 98px,#000 99px,#000 106px,transparent 107px);mask:radial-gradient(circle,transparent 98px,#000 99px,#000 106px,transparent 107px);
    animation:dspin 24s linear infinite}
  .drings::before{content:"";width:160px;height:160px;margin:-80px 0 0 -80px;border:1px dashed rgba(157,107,255,.55);animation:dspin 16s linear infinite reverse}
  @keyframes dspin{to{transform:rotate(360deg)}}
  .dburst{position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(circle,rgba(255,226,150,.85) 0%,rgba(243,201,105,.35) 30%,rgba(157,107,255,0) 65%)}
  .tray.revealed .dburst{animation:dburst .9s ease-out}
  .tray.fumble .dburst{background:radial-gradient(circle,rgba(255,110,110,.8) 0%,rgba(200,40,40,.3) 30%,rgba(0,0,0,0) 65%)}
  .tray.crit{box-shadow:inset 0 0 0 2px var(--win),inset 0 0 50px rgba(243,201,105,.35)}
  @keyframes dburst{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
  @media (prefers-reduced-motion: reduce){.drings,.drings::before{animation:none}}
  .tray-cap{position:absolute;left:14px;top:12px;font-size:12px;font-weight:700;color:#f4e6c4;background:rgba(0,0,0,.35);
    padding:2px 9px;border-radius:999px;letter-spacing:.04em}
  .tray .dice{height:100%;justify-content:center;align-items:center}
  .fxdmg{position:absolute;font:800 20px -apple-system,"PingFang SC",sans-serif;color:#ff5c5c;text-shadow:0 2px 0 #3a0000,0 0 10px rgba(255,60,60,.6);pointer-events:none}
  /* random-event animations play in a layer over the map, on the zones the event hit */
  .mapwrap{position:relative;padding-top:40px}
  #fx{position:absolute;inset:0;pointer-events:none}
  .fxbox{position:absolute;border-radius:12px;overflow:hidden}
  .fxbox .tint{position:absolute;inset:0}
  .fxbox .sp{position:absolute;font-size:26px;line-height:1;will-change:transform}
  .fxbanner{position:absolute;left:50%;top:2px;z-index:2;display:flex;gap:10px;align-items:center;white-space:nowrap;
    background:rgba(8,10,20,.9);color:#fff;font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid var(--win);
    box-shadow:0 6px 20px rgba(0,0,0,.45)}
  .fxbanner span{color:var(--dim);font-size:12px}
  .evroll{position:absolute;left:50%;top:55%;z-index:3;transform:translate(-50%,-50%);width:250px;pointer-events:none}
  .evroll .tray{height:190px;margin:0;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  .evkey{display:flex;justify-content:center;gap:6px;margin-top:6px}
  .evkey span{font-size:12px;color:#d8dcef;background:rgba(8,10,20,.88);border:1px solid #2a3150;border-radius:999px;padding:2px 9px;transition:.2s}
  .evkey span b{color:#f3c969}
  .evkey span.on{background:#f3c969;color:#1a1206;border-color:#f3c969;font-weight:700;transform:scale(1.12)}
  .evkey span.on b{color:#1a1206}
  .replay{font:inherit;font-size:11.5px;color:var(--dim);background:none;border:1px dashed var(--line);border-radius:8px;padding:1px 8px;cursor:pointer;margin-left:6px}
</style>
<header>
  <h1>⚔️ Arena 玩家席</h1>
  <span id="who" class="pill">连接中…</span>
  <span id="round" class="pill"></span>
  <span id="status" class="pill"></span>
  <span id="zones" style="color:var(--dim);font-size:13px"></span>
  <button type="button" id="reseat" class="ghost-btn" hidden>换座位</button>
</header>
<main>
  <div id="roundbar" class="roundbar"></div>
  <div id="fatal" class="err"></div>
  <div id="notice" class="err"></div>
  <div class="grid">
    <div>
      <div class="panel"><h3>地图 <span id="mapHint" class="k"></span><button type="button" class="replay" id="fxReplay" hidden>▶ 重播事件</button></h3><div class="mapwrap"><div class="map" id="map"></div><div id="fx"></div></div></div>
      <div class="panel"><h3>角色介绍</h3><div id="me"></div>
        <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px"><h3>秘密身份(只有你能看到)</h3><div id="ident"></div></div></div>
      <div class="panel" id="formPanel" style="display:none"><h3 id="formTitle">你的决定</h3><div id="form"></div></div>
      <div class="panel"><h3>消息</h3><div id="msgs" class="scroll"></div></div>
      <div class="panel"><h3>公开事件</h3><div id="events" class="scroll"></div></div>
    </div>
    <div>
      <div class="panel" id="reflectPanel" style="display:none"><h3>出局感悟</h3><div id="reflect"></div></div>
      <div class="panel" id="resultPanel" style="display:none"><h3>对局结果</h3><div id="result"></div></div>
      <div class="panel"><h3>我的最近动作</h3><div id="acts" class="scroll"></div></div>
      <div class="panel"><details><summary>规则与我的开局简报</summary><pre id="brief"></pre></details></div>
    </div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Data comes from the Artifact's shared db, written by Claude (play/artifact_bridge.py):
   steps/<step> (latest = current), views/<step>-<slot> (one human seat's view), and the page
   writes decisions/<step>-<slot> or decisions/refl-<slot>. A slot is a random code per human
   seat. Both computers use one account, so the slot is picked once per browser and remembered. */
let DB = null, STEP = null, SEAT = null, WATCHED = "", VIEWDOC = null, MYDEC = null, REFL_SENT = false;
let unsubView = null, unsubDec = null;
const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};
const ZN = {center:"中心",forest:"林",water:"水",stone:"石",city:"城"};
const ZC = {center:"zc",forest:"zn",water:"ze",stone:"zs",city:"zw"};
const STATUS = {your_turn:"轮到你了",submitted:"已提交,等待其他人",waiting:"等待其他人",dead:"你已出局",over:"游戏结束"};
const PHASE = {start:"准备中",move:"移动",act:"行动",reflect:"收感悟",over:"结束"};
const XLABEL = {eat:"吃食物",trade:"交换(给同区玩家一张牌)",steal:"偷牌(掷 d4 出 4 成功)",craft:"合成武器",poison:"下毒(2 食物→毒食物)",peek:"偷看身份(每局一次)",feed:"喂食",bomb:"做炸弹"};
const WICON = {"弓":"🏹","三叉戟":"🔱","斧子":"🪓","长剑":"🗡️","弯刀":"🗡️","双节棍":"🥢"};
let REPICKED = false, V = null, SIG = "", EDITING = false, FORM = null, FORMKEY = "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pl = (s) => V.players.find(p => p.seat === +s);
const nm = (s) => { const p = pl(s); return esc(p ? `s${p.seat} ${p.name}` : `s${s}`); };
const hpColor = (hp, max) => { const r = hp / max; return r > .5 ? "#1D9E75" : r > .25 ? "#EF9F27" : "#E24B4A"; };
const icon = (c) => c.type === "weapon" ? (WICON[c.name] || "⚔️") : c.type === "food" ? "🍎" : c.type === "ammo" ? "🔩" : "🛡️";

function apply() {
  if (!VIEWDOC) return;
  const d = Object.assign({}, VIEWDOC);
  const mine = MYDEC && MYDEC.body && MYDEC.step === STEP.step;
  if (mine && d.status === "your_turn") { d.status = "submitted"; d.submitted = MYDEC.body; }
  $("notice").textContent = !mine && (d.errors || []).length ? "上次提交没通过:" + d.errors.join(";") + " 请改一下再提交。" : "";
  const sig = JSON.stringify(d);
  if (sig === SIG) return;
  SIG = sig; V = d;
  syncForm();
  render();
}
async function poll() { SIG = ""; apply(); }

/* ==== arena_fx.js (generated by app/fx/build.py) ==== */
/* Arena dice + random-event effects, shared by app/play.html, app/artifact_play.html and the
   animation preview. Inlined into those pages by app/fx/build.py -- edit this file, then run it.

   Needs from the page: $(id), ZC (zone -> map cell class). Dice use three.js (global THREE) when
   it loaded, and fall back to flat SVG dice without it. */

function randInt(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return 1 + (a[0] % n); }
const REDUCED = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ======================= dice ======================= */

/* Flat fallback: an N-sided polygon (d2 = coin), used only when WebGL/three.js is unavailable. */
function dieSVG(faces, value) {
  if (faces <= 2) return `<svg viewBox="-34 -34 68 68"><circle class="shape" r="28"></circle><text class="num">${value ?? "?"}</text></svg>`;
  const n = Math.min(faces, 12), r = 30, pts = [];
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; pts.push(`${(r * Math.cos(a)).toFixed(1)},${(r * Math.sin(a)).toFixed(1)}`); }
  return `<svg viewBox="-34 -34 68 68"><polygon class="shape" points="${pts.join(" ")}"></polygon><text class="num">${value ?? "?"}</text></svg>`;
}
function diceHTML(faces, n, values) {
  const best = values ? Math.max(...values) : null;
  return `<div class="dice">${Array.from({length: n}, (_, i) => {
    const v = values ? values[i] : null;
    return `<div class="die ${faces <= 2 ? "coin" : ""} ${values && n > 1 && v === best && values.indexOf(v) === i ? "best" : ""}">${dieSVG(faces, v)}<span class="dn">${faces <= 2 ? "硬币 d2" : "d" + faces}</span></div>`;
  }).join("")}</div>`;
}

/* Dice in the style of a big "moment" roll: one large gem-like die floats over an arcane circle,

      g.fillStyle = fg; g.beginPath(); g.ellipse(x, y - S * .17, 4 * fl, 8 * fl, 0, 0, 7); g.fill(); });

function floatDamage(layer, zoneEl, seats, amount) {
  const L = layer.getBoundingClientRect();
  zoneEl.querySelectorAll(".tok").forEach(tok => {
    const m = tok.textContent.match(/s(\d+)/); if (!m || !seats.includes(+m[1])) return;
    const r = tok.getBoundingClientRect(), d = document.createElement("div"); d.className = "fxdmg"; d.textContent = `-${amount}`;
    d.style.left = (r.left - L.left + r.width / 2) + "px"; d.style.top = (r.top - L.top - 6) + "px";
    layer.appendChild(d);
    d.animate([{transform: "translate(-50%,0) scale(.6)", opacity: 0}, {transform: "translate(-50%,-10px) scale(1.25)", opacity: 1, offset: .25},
               {transform: "translate(-50%,-34px) scale(1)", opacity: 0}], {duration: 1600, delay: 700, easing: "ease-out", fill: "both"});
    setTimeout(() => d.remove(), 2600);

const FX_ZONE = {center: "中心", forest: "林区", water: "水区", stone: "石区", city: "城区"};
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Before the event lands: a die thrown over the map picks the zone (1 = the first outer zone still
   open, and so on), and the picked zone lights up. Skipped for events that pick their own zones. */
async function rollEventZone(ev) {
  const layer = $("fx"), order = ev.zone_order || [];
  if (!layer || !(ev.faces >= 2) || !ev.roll || ev.id === "E06" || ev.id === "E08") return;
  const box = document.createElement("div"); box.className = "evroll";
  box.innerHTML = `<div class="tray"><span class="tray-cap">🎲 随机事件 · 掷 ${Dice3D.name(ev.faces)} 定区域</span></div>
    <div class="evkey">${order.map((z, i) => `<span data-i="${i + 1}"><b>${i + 1}</b> ${FX_ZONE[z] || z}</span>`).join("")}</div>`;
  layer.appendChild(box);
  box.animate([{opacity: 0, transform: "translate(-50%,-50%) scale(.9)"}, {opacity: 1, transform: "translate(-50%,-50%) scale(1)"}], {duration: 220, fill: "both"});
  await sleep(250);
  await Dice3D.roll(box.querySelector(".tray"), ev.faces, 1, [ev.roll]);
  const hit = box.querySelector(`[data-i="${ev.roll}"]`); if (hit) hit.classList.add("on");
  const zEl = document.querySelector(`#map .zone.${ZC[order[ev.roll - 1]]}`);
  if (zEl) zEl.animate([{boxShadow: "0 0 0 0 rgba(243,201,105,0)"}, {boxShadow: "0 0 0 4px rgba(243,201,105,.95), 0 0 24px rgba(243,201,105,.6)", offset: .3},
                        {boxShadow: "0 0 0 0 rgba(243,201,105,0)"}], {duration: 1000});
  await sleep(900);
  await box.animate([{opacity: 1}, {opacity: 0}], {duration: 250, fill: "both"}).finished;
  Dice3D.release(); box.remove();
}

/* Events that happened this round and this browser hasn't shown yet play once, on their own. */
function fxKey(ev) { return `${String(V.step || "local").split("-")[0]}:${ev.round}:${ev.id}`; }
function playNewEvents() {
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem("arena_fx_seen") || "[]"); } catch (e) {}
  (V.random_events || []).filter(ev => ev.round === V.round && !seen.includes(fxKey(ev))).forEach(ev => {
    seen.push(fxKey(ev)); setTimeout(() => playEvent(ev), 300);
  });
  try { localStorage.setItem("arena_fx_seen", JSON.stringify(seen.slice(-50))); } catch (e) {}
}

async function playEvent(ev) {
  if (!REDUCED()) await rollEventZone(ev);
  const layer = $("fx"); if (!layer) return;
  const L = layer.getBoundingClientRect();
  const banner = document.createElement("div"); banner.className = "fxbanner";
  banner.innerHTML = `<b>${FX_LABEL[ev.id] || ev.name}</b><span>${(ev.zones || []).map(z => FX_ZONE[z] || z).join(" · ")}</span>`;
  layer.appendChild(banner);
  banner.animate([{opacity: 0, transform: "translate(-50%,-14px)"}, {opacity: 1, transform: "translate(-50%,0)", offset: .1},
                  {opacity: 1, transform: "translate(-50%,0)", offset: .85}, {opacity: 0, transform: "translate(-50%,-8px)"}], {duration: FX_MS + 400, fill: "both"});
  setTimeout(() => banner.remove(), FX_MS + 500);
  (ev.zones || []).forEach(z => {
    const el = document.querySelector(`#map .zone.${ZC[z]}`); if (!el) return;
    const R = el.getBoundingClientRect(), w = R.width, h = R.height, b = document.createElement("div"); b.className = "fxbox";
    Object.assign(b.style, {left: (R.left - L.left) + "px", top: (R.top - L.top) + "px", width: w + "px", height: h + "px"});
    layer.appendChild(b);
    if (!REDUCED() && FX[ev.id]) {
      const g = fxCanvas(b, w, h), s = {}, t0 = performance.now(); let last = t0;
      const loop = now => { const t = Math.min(1, (now - t0) / FX_MS), dt = Math.min(.05, (now - last) / 1000); last = now;
        g.clearRect(0, 0, w, h); FX[ev.id](g, w, h, t, s, dt); if (t < 1) requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
      if (ev.id === "E06" || ev.id === "E01")            // the whole zone shakes as it gets hit
        b.animate([{transform: "translate(0,0)"}, {transform: "translate(-3px,2px)"}, {transform: "translate(3px,-2px)"}, {transform: "translate(-2px,-1px)"}, {transform: "translate(0,0)"}],
                  {duration: 380, delay: ev.id === "E06" ? 420 : 250, iterations: 2});
    }
    if (FX_DAMAGE[ev.id] && ev.hits) floatDamage(layer, el, ev.hits, FX_DAMAGE[ev.id]);
    setTimeout(() => b.remove(), FX_MS + 300);
  });
}

function fromSubmitted(f, d) {
  if (d.move) f.move = d.move;
  if (Array.isArray(d.roll)) f.roll = d.roll;
  if (d.action) f.action = d.action;
  if (typeof d.memo === "string") f.memo = d.memo;
  (d.say || []).slice(0, 2).forEach((m, i) => { f.says[i] = {to: m.to === undefined || m.to === null ? "all" : m.to, text: m.text || ""}; });
  (d.extra || []).forEach(x => {
    const [k, ...rest] = String(x).split(":");
    if (k === "eat") { f.eat.add(rest.join(":")); return; }
    if (k === "declare") { rest.join(":").split(",").forEach(p => { const [s, i] = p.split("="); if (i) f.decl[String(s).replace(/^s/, "")] = i; }); f.declOpen = true; return; }
    const e = f.extras[k] = {on: true};
    if (k === "trade" || k === "feed") { e.target = rest[0]; e.card = rest.slice(1).join(":"); }
    else if (k === "steal" || k === "peek") e.target = rest[0];

  });
  return f;
}

  if (!o || !FORM) { $("formPanel").style.display = "none"; Dice3D.release(); return; }
  $("formPanel").style.display = "";
  $("formTitle").textContent = V.status === "submitted" ? "已提交(结算前可以修改)" : "你的决定";
  let h = "";
  if (o.kind === "act") {
    h += `<div class="sec"><div class="lbl">主行动${o.forced_attack ? " · 你在中心,必须攻击" : ""}</div><div class="chips">
      ${o.forced_attack ? "" : chip("data-act", "draw", "🃏 抽一张本区牌", FORM.action === "draw")}
      ${o.attack.map(s => chip("data-act", "attack:" + s, "⚔️ 攻击 " + nm(s), FORM.action === "attack:" + s)).join("")}</div></div>`;
    if (String(FORM.action).startsWith("attack:")) h += diceBlock();
    const xs = o.extras.filter(x => x.kind !== "eat");
    const eats = [...FORM.eat].map(id => (V.me.hand.find(c => c.id === id) || {name: id}).name);
    h += `<div class="sec"><div class="lbl">附加行动(可选)</div>`;
    if (o.extras.some(x => x.kind === "eat")) h += `<div class="k" style="margin-bottom:6px">🍎 ${eats.length ? "本回合吃掉:" + esc(eats.join("、")) + "(在上面的手牌上再双击可取消)" : "在上面角色卡的手牌里双击食物牌,就能在本回合吃掉它"}</div>`;
    h += xs.map(xBox).join("") || (o.extras.length ? "" : `<div class="k">现在没有可用的附加行动</div>`);
    h += `<div class="xbox ${FORM.declOpen ? "on" : ""}">${chip("data-decl-toggle", "1", "🎭 声明别人的身份", FORM.declOpen, "sm")}`;
    if (FORM.declOpen) h += V.players.filter(p => p.seat !== V.seat).map(p => `<div class="sub"><span class="k" style="min-width:86px">${nm(p.seat)}</span>${chip("data-decl", p.seat + "=", "不猜", !FORM.decl[p.seat], "sm")}${o.identities.map(i => chip("data-decl", p.seat + "=" + i, esc(i), FORM.decl[p.seat] === i, "sm")).join("")}</div>`).join("");
    h += `</div></div>`;
  }
  h += `<div class="sec"><div class="lbl">${o.kind === "act" ? "下回合去哪" : "这回合去哪"} · 也可以直接点地图</div><div class="chips">${o.moves.map(z => chip("data-move", z, (z === V.me.zone ? "留在 " : "") + ZN[z], FORM.move === z)).join("")}</div></div>`;
  h += `<div class="sec"><div class="lbl">备忘(只有你自己下回合能看到)</div><textarea id="memo" maxlength="400">${esc(FORM.memo)}</textarea></div>`;
  const to = (o.say_to || V.players.filter(p => p.alive && p.seat !== V.seat).map(p => p.seat));
  h += `<div class="sec"><div class="lbl">喊话 / 私聊(可空)· 点地图上的玩家名字也能私聊</div>`;
  [0, 1].forEach(i => {
    const s = FORM.says[i];
    h += `<div class="say"><div class="chips">${chip(`data-to${i}`, "all", "📢 公开", s.to === "all")}${to.map(t => chip(`data-to${i}`, t, "✉️ " + nm(t), String(s.to) === String(t), "dm")).join("")}</div>
      <input class="txt" id="say${i}" maxlength="200" placeholder="${s.to === "all" ? "对所有人说…" : "悄悄对 s" + s.to + " 说…"}" value="${esc(s.text)}"></div>`;
  });
  h += `</div><div id="f_err" class="err"></div>
    <div style="display:flex;align-items:center;gap:12px"><button class="go-btn" id="f_go">${V.status === "submitted" ? "改好了,重新准备 ✓" : "准备好了 ✓"}</button><span id="f_ok" class="ok"></span></div>`;
  $("form").innerHTML = h;
  ["say0", "say1"].forEach((id, i) => $(id).oninput = (e) => { FORM.says[i].text = e.target.value; touch(); });
  $("memo").oninput = (e) => { FORM.memo = e.target.value; touch(); };
  $("f_go").onclick = submit;
  if ($("rollBtn")) $("rollBtn").onclick = rollDice;
  if ($("diceArea")) Dice3D.show($("diceArea"), V.me.attack, V.me.attack_rolls || 1, FORM.roll);
  else Dice3D.release();
}

function xBox(x) {
  const e = FORM.extras[x.kind] || {};
  let h = `<div class="xbox ${e.on ? "on" : ""}">${chip("data-xon", x.kind, esc(XLABEL[x.kind] || x.kind), e.on, "sm")}`;
  if (e.on) {
    if (x.targets) h += `<div class="sub"><span class="k">对谁</span>${x.targets.map(s => chip("data-xt", x.kind + "|" + s, nm(s), String(e.target) === String(s), "sm")).join("") || `<span class="k">同区没人</span>`}</div>`;
    if (x.cards) h += `<div class="sub"><span class="k">哪张</span>${x.cards.map(c => chip("data-xc", x.kind + "|" + c.id, esc(c.label), e.card === c.id, "sm")).join("")}</div>`;
    if (x.zones) h += `<div class="sub"><span class="k">炸哪</span>${x.zones.map(z => chip("data-xz", x.kind + "|" + z, ZN[z], e.zone === z, "sm")).join("")}</div>`;
  }
  return h + `</div>`;
}

/* ---------- interactions (delegated) ---------- */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act],[data-move],[data-zone],[data-talk],[data-to0],[data-to1],[data-xon],[data-xt],[data-xc],[data-xz],[data-decl],[data-decl-toggle]");
  if (!t || !FORM) return;
  const d = t.dataset;
  if (d.act) FORM.action = d.act;
  else if (d.move) FORM.move = d.move;
  else if (d.zone) FORM.move = d.zone;
  else if (d.talk) {
    const i = !FORM.says[0].text || FORM.says[0].to === "all" ? 0 : 1;
    FORM.says[i].to = +d.talk; touch(); renderForm(); renderMap();
    const inp = $("say" + i); if (inp) { inp.focus(); inp.scrollIntoView({block: "center", behavior: "smooth"}); }
    return;
  }
  else if (d.to0 !== undefined) FORM.says[0].to = d.to0 === "all" ? "all" : +d.to0;
  else if (d.to1 !== undefined) FORM.says[1].to = d.to1 === "all" ? "all" : +d.to1;
  else if (d.xon) { const e = FORM.extras[d.xon] = FORM.extras[d.xon] || {}; e.on = !e.on;
    const x = V.options.extras.find(x => x.kind === d.xon);
    if (e.on && x) { if (x.targets && e.target === undefined && x.targets.length) e.target = String(x.targets[0]); if (x.cards && !e.card && x.cards.length) e.card = x.cards[0].id; if (x.zones && !e.zone) e.zone = x.zones[0]; } }
  else if (d.xt) { const [k, v] = d.xt.split("|"); FORM.extras[k].target = v; }
  else if (d.xc) { const [k, ...v] = d.xc.split("|"); FORM.extras[k].card = v.join("|"); }
  else if (d.xz) { const [k, v] = d.xz.split("|"); FORM.extras[k].zone = v; }
  else if (d.declToggle) FORM.declOpen = !FORM.declOpen;
  else if (d.decl !== undefined) { const [s, i] = d.decl.split("="); if (i) FORM.decl[s] = i; else delete FORM.decl[s]; }
  touch(); renderForm(); renderMap();
});
document.addEventListener("dblclick", (ev) => {
  const t = ev.target.closest("[data-eat]");
  if (!t || !FORM) return;
  const id = t.dataset.eat;
  FORM.eat.has(id) ? FORM.eat.delete(id) : FORM.eat.add(id);
  touch(); renderMe(); renderForm();
});

function collect() {
  const o = V.options, d = {round: V.round, phase: V.phase, move: FORM.move, memo: FORM.memo.trim(), say: []};
  FORM.says.forEach(s => { const t = s.text.trim(); if (t) d.say.push({to: s.to, text: t}); });
  if (o.kind === "act") {
    d.action = FORM.action;
    if (String(FORM.action).startsWith("attack:") && FORM.roll) d.roll = FORM.roll;
    d.extra = [...FORM.eat].map(id => "eat:" + id);
    Object.entries(FORM.extras).forEach(([k, e]) => {
      if (!e.on) return;
      if (k === "trade" || k === "feed") d.extra.push(`${k}:${e.target}:${e.card}`);
      else if (k === "steal" || k === "peek") d.extra.push(`${k}:${e.target}`);
      else if (k === "bomb") d.extra.push(`bomb:${e.zone}`);
      else d.extra.push(k);
    });
    const pairs = Object.entries(FORM.decl).map(([s, i]) => `s${s}=${i}`);
    if (pairs.length) d.extra.push("declare:" + pairs.join(","));
  }
  return d;
}

async function post(body) {
  if (!DB || !STEP) return [0, {error: "还没连上对局"}];
  try {
    if (body.reflection !== undefined) {
      const text = String(body.reflection || "").trim();
      if (!text) return [400, {errors: ["感悟不能为空"]}];
      await DB.doc("decisions/refl-" + SEAT).set({slot: SEAT, reflection: text.slice(0, 2000), at: Date.now()});
      REFL_SENT = true;
      return [200, {ok: true}];
    }
    if (STEP.step !== V.step) return [409, {error: "这一步已经结算了,页面已刷新,请看新的局面再决定。"}];
    await DB.doc("decisions/" + STEP.step + "-" + SEAT).set({step: STEP.step, slot: SEAT, body, at: Date.now()});
    return [200, {ok: true}];
  } catch (e) { return [0, {error: "没存上(" + (e && e.code || e) + "),稍后再试"}]; }
}

async function submit() {
  if (V.options && V.options.kind === "act" && String(FORM.action).startsWith("attack:") && !FORM.roll) {
    $("f_err").textContent = "先点「掷骰子」掷出伤害,再提交。"; return;
  }
  $("f_go").disabled = true; $("f_err").textContent = ""; $("f_ok").textContent = "";
  let code, r;
  try { [code, r] = await post(collect()); } catch (e) { code = 0; r = {error: "连不上服务器,稍后再试"}; }
  $("f_go").disabled = false;
  if (code === 200) { EDITING = false; $("notice").textContent = ""; SIG = ""; await poll(); if ($("f_ok")) $("f_ok").textContent = "已提交 ✓"; }
  else if (code === 409) { EDITING = false; $("notice").textContent = r.error; SIG = ""; poll(); }
  else $("f_err").textContent = (r.errors || [r.error]).join("\n");
}

function renderReflect() {
  const r = V.reflection;
  if (!r) { $("reflectPanel").style.display = "none"; return; }
  $("reflectPanel").style.display = "";
  if (!r.open) { $("reflect").innerHTML = `<div class="row">${esc(r.text || "")}</div>`; return; }
  if (REFL_SENT) { $("reflect").innerHTML = `<div class="ok">感悟已提交,谢谢!</div>`; return; }
  if ($("r_text")) return;
  $("reflect").innerHTML = `<div class="k">写写你的计划、哪里失误了、对游戏节奏的看法。之后你只能看公开信息,等游戏结束。</div>
    <textarea id="r_text" maxlength="2000" style="margin:8px 0"></textarea><div id="r_err" class="err"></div><button class="go-btn" id="r_go">提交感悟</button>`;
  $("r_go").onclick = async () => {
    const [code, res] = await post({reflection: $("r_text").value});
    if (code === 200) { SIG = ""; $("reflect").innerHTML = ""; poll(); } else $("r_err").textContent = (res.errors || [res.error]).join("\n");
  };
}

function guessLines(r) {
  const g = Object.entries(r.human_guesses || {});
  if (!g.length) return "";
  const hs = new Set(r.humans || []);
  return `<div class="row" style="margin-top:10px"><b>🕵️ 谁是人类?</b> 真正的人类:${[...hs].map(nm).join("、")}</div>` +
    g.map(([s, t]) => `<div class="row">${nm(s)} 最后猜是 ${nm(t)} ${hs.has(+t) ? "✅ 猜对了" : "❌"}</div>`).join("");
}

function renderResult() {
  const r = V.result;
  if (!r) { $("resultPanel").style.display = "none"; return; }
  $("resultPanel").style.display = "";
  $("result").innerHTML = V.players.map(p => {
    const w = r.winners[p.seat];
    return `<div class="row">${nm(p.seat)} · ${esc(r.identities[p.seat])} · ${p.alive ? "存活" : "出局"}${w ? ` · <span class="big">🏆 ${esc(w.join("、"))}</span>` : ""}</div>`;
  }).join("") + guessLines(r) + `<div class="row k">完整回放和每个 AI 的思考,可以在聊天里让 Claude 发给你。</div>`;
}

function pickSeat() {
  document.querySelector(".grid").hidden = true;       // nothing from any seat shows until you pick
  const hs = STEP.humans || [];
  if (!hs.length) { $("fatal").textContent = "这一局没有人类座位。"; return; }
  $("who").textContent = "选座位";
  $("notice").innerHTML = `<div class="panel"><h3>选择你的座位</h3>
    <div class="k" style="margin-bottom:8px">先和对方约好谁是玩家 1、谁是玩家 2,再点自己的号。点了之后这台电脑只显示你的座位,角色和身份也是点了才看得到。别点对方的号哦。</div>
    <div class="chips">${hs.map((h, i) => `<button type="button" class="chip" data-pick="${h.slot}">玩家 ${i + 1}</button>`).join("")}</div></div>`;
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    SEAT = b.dataset.pick; store.set("arena_seat_" + STEP.game, SEAT);
    $("notice").textContent = ""; watchSeat();
  });
}

function watchSeat() {
  document.querySelector(".grid").hidden = false;
  const id = STEP.step + "-" + SEAT;
  if (id === WATCHED) return;
  WATCHED = id;
  $("reseat").hidden = false;
  if (unsubView) unsubView();
  if (unsubDec) unsubDec();
  VIEWDOC = null; MYDEC = null;
  unsubView = DB.doc("views/" + id).onSnapshot(s => { VIEWDOC = s.exists ? s.data() : null; apply(); },
                                               e => { $("fatal").textContent = "读不到你的座位信息(" + e.code + "),刷新试试"; });
  unsubDec = DB.doc("decisions/" + id).onSnapshot(s => { MYDEC = s.exists ? s.data() : null; apply(); }, () => {});
}

$("reseat").onclick = () => {
  if (!STEP) return;
  const b = $("reseat");
  if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "确定换座位?再点一次"; setTimeout(() => { b.dataset.armed = ""; b.textContent = "换座位"; }, 4000); return; }
  b.dataset.armed = ""; b.textContent = "换座位"; b.hidden = true;
  if (unsubView) unsubView();
  if (unsubDec) unsubDec();
  V = null; VIEWDOC = null; MYDEC = null; SIG = "";
  store.set("arena_seat_" + STEP.game, null); SEAT = null; WATCHED = "";
  document.querySelector(".grid").hidden = true;
  pickSeat();
};

async function boot() {
  $("who").textContent = "连接中…";
  DB = await claude.use("db");
  if (!DB) { $("fatal").textContent = "这个页面要在 claude.ai 里登录后打开,才能读写对局。"; $("who").textContent = "未连接"; return; }
  DB.collection("steps").orderBy("seq", "desc").limit(1).onSnapshot(snap => {
    const d = snap.docs[0] && snap.docs[0].data();
    if (!d) { $("who").textContent = "等待开局"; $("fatal").textContent = "";
      $("notice").innerHTML = `<div class="panel"><h3>还没有对局</h3><div class="k">让 Claude 在聊天里开局。开好后这里会自动出现座位。</div></div>`; return; }
    const newGame = !STEP || STEP.game !== d.game;
    STEP = d;
    if (newGame) { SEAT = null; WATCHED = ""; const saved = store.get("arena_seat_" + d.game); if (saved !== null) SEAT = saved; }
    if (SEAT === null || !d.humans.some(h => h.slot === SEAT)) return pickSeat();
    watchSeat();
  }, e => { $("fatal").textContent = "连不上对局数据(" + e.code + "),刷新试试"; });
}
boot();
</script>
